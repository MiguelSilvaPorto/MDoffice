<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ícone da aba do navegador (a janela do Tauri usa o ícone do executável). -->
    <link rel="icon" type="image/png" href="/icones/mdoffice-escuro.png" />
    <link rel="apple-touch-icon" href="/icones/mdoffice-escuro.png" />
    <title>mdOffice — editor de documentos</title>
    <script>
      // Aplica o tema guardado ANTES de qualquer pintura. Sem isto o WebView
      // começa no claro (data-theme="light" no <html>) e quem usa o escuro vê um
      // clarão branco até o JS do app rodar.
      // O nível de animação e os cantos entram no <html> pelo mesmo motivo: sem
      // isto a primeira pintura usa o tempo/raio padrão e "pula" ao aplicar.
      try {
        var tema = localStorage.getItem("mdc.theme");
        if (tema === "dark" || tema === "light") document.documentElement.dataset.theme = tema;
        var anim = localStorage.getItem("mdc.animacao");
        if (anim === "discreta" || anim === "completa") document.documentElement.classList.add("anim-" + anim);
        // "redondos" é o desenho original do app: não leva classe nenhuma
        if (localStorage.getItem("mdc.cantos") === "quadrados") document.documentElement.classList.add("cantos-quadrados");
      } catch (e) {
        /* sem armazenamento: fica no padrão */
      }
    </script>
    <!--
      Tela de carregamento. Fica AQUI, no próprio HTML, e não em src/styles/:
      o pacote do app (CSS + JS) só chega depois, e nesse intervalo o WebView
      pintaria o HTML cru sem estilo — os ícones do sprite aparecem gigantes e a
      interface fica irreconhecível. Por isso o mínimo de estilo que cobre a tela
      vem embutido, e a marca é SVG inline (não precisa de rede).
      Ela é removida em src/main.ts assim que o app termina de iniciar.
    -->
    <style>
      /* Trava a rolagem da PÁGINA já aqui, com os MESMOS valores do CSS do app
         (src/styles/base.css) — assim nada muda quando o pacote chega. O CSS do
         app (CSS + JS) só carrega depois; nesse intervalo a página fica sem
         estilo, mais alta que a janela, e dá para rolar com a roda ou arrastar a
         barra por baixo da tela de carregamento. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f4f5f8;
        color: #1c212b;
        font-family: Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      [data-theme="dark"] #boot {
        background: #0e1014;
        color: #e6e8ee;
      }
      #boot .boot-mark {
        display: block;
        width: 52px;
        height: 52px;
      }
      #boot .boot-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.2px;
        opacity: 0.9;
      }
      #boot .boot-bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        background: rgba(127, 127, 127, 0.25);
        overflow: hidden;
      }
      #boot .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #4f46e5;
        animation: boot-corre 1.1s ease-in-out infinite;
      }
      [data-theme="dark"] #boot .boot-bar i {
        background: #818cf8;
      }
      @keyframes boot-corre {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      /* quem pediu menos movimento recebe a barra cheia, sem animação */
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar i {
          animation: none;
          width: 100%;
        }
      }
      /* saída suave: some sem piscar */
      #boot.boot-saindo {
        opacity: 0;
        transition: opacity 0.18s ease;
      }
    </style>
  </head>

      <symbol id="i-table-col-del" viewBox="0 0 24 24"><rect x="6" y="3" width="13" height="18" rx="1.5"/><path d="M12 3v18M2 12h4"/></symbol>
      <symbol id="i-table-merge" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h4M16 12h4M12 4v4M12 16v4"/></symbol>
      <symbol id="i-table-split" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h16M12 4v16"/></symbol>
      <symbol id="i-win-min" viewBox="0 0 12 12"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
      <symbol id="i-win-max" viewBox="0 0 12 12"><rect x="1.75" y="1.75" width="8.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="i-win-restore" viewBox="0 0 12 12"><path d="M3.75 3.75V2.5A1.25 1.25 0 0 1 5 1.25h4.5A1.25 1.25 0 0 1 10.75 2.5v4.5A1.25 1.25 0 0 1 9.5 8.25H8.25" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="1.25" y="3.75" width="7" height="7" rx="1.25" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="i-win-close" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.3-2.91 8.25-7 9.5-4.09-1.25-7-5.2-7-9.5V6z"/><path d="M9 12.5 11.5 15 15.5 10"/></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v10"/><path d="M8 9.5l4 4 4-4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    </svg>

    <div id="app">
      <header id="topbar" data-tauri-drag-region>
        <div class="tb-left" data-tauri-drag-region>
          <button class="btn icon tb-icon-btn" id="tb-sidebar" data-act="toggle-sidebar" title="Mostrar/ocultar painel lateral"><svg class="ic"><use href="#i-sidebar"/></svg></button>
          <div class="tb-quick-actions" role="group" aria-label="Ações de arquivo">
            <button class="btn icon tb-icon-btn" data-act="new" title="Novo documento (Ctrl+N)"><svg class="ic"><use href="#i-new"/></svg></button>
            <button class="btn icon tb-icon-btn" data-act="open" title="Abrir arquivo (Ctrl+O)"><svg class="ic"><use href="#i-open"/></svg></button>
            <button class="btn icon tb-icon-btn" data-act="save" title="Salvar (Ctrl+S)"><svg class="ic"><use href="#i-save"/></svg></button>
          </div>
          <div class="tb-autosave-wrap" id="tb-autosave-wrap">
            <button class="tb-autosave-toggle is-active" id="tb-autosave-btn" role="switch" aria-checked="true" data-act="toggle-autosave" title="Salvamento Automático (clique para ligar/desligar)">
              <span class="tb-autosave-track" aria-hidden="true">
                <span class="tb-autosave-thumb"></span>
              </span>
              <span class="tb-autosave-label">Salvamento Automático</span>
            </button>
            <button class="tb-autosave-badge is-on" id="tb-autosave-badge" data-act="toggle-autosave" title="Status do Salvamento Automático (clique para alternar)">
              <svg class="ic tb-autosave-ic" id="tb-autosave-ic"><use href="#i-check"/></svg>
              <span class="tb-autosave-text" id="tb-autosave-text">Salvo</span>
            </button>
            <button class="tb-saved-path" id="tb-saved-path" hidden title="Mostrar arquivo na pasta">
              <svg class="ic tb-saved-path-ic"><use href="#i-folder"/></svg>
              <span class="tb-saved-path-text" id="tb-saved-path-text"></span>
            </button>
          </div>
        </div>

        <div class="tb-center" data-tauri-drag-region>
          <button class="btn palette-btn" data-act="palette" title="Buscar comandos e arquivos (Ctrl+K)">
            <svg class="ic"><use href="#i-search"/></svg>
            <span class="palette-text">Buscar comando ou documento…</span>
            <kbd>Ctrl K</kbd>
          </button>
        </div>

        <div class="tb-right" data-tauri-drag-region>
          <div class="tb-tools">
            <button class="btn toggle tb-pill-btn" id="btn-translate" data-act="translate-toggle" title="Tradução automática PT-BR → inglês (Ctrl+Alt+T)"><svg class="ic"><use href="#i-globe"/></svg><span>Traduzir</span></button>
            <div class="split-btn tb-split-draw">
              <button class="btn tb-draw-main" data-act="draw" title="Desenhar no documento (Ctrl+Shift+D)"><svg class="ic"><use href="#i-draw"/></svg><span>Desenhar</span></button>
              <button class="btn split-caret tb-draw-caret" data-menu="draw-style" title="Tipo de desenho: imagem ou símbolos" aria-haspopup="menu" aria-label="Tipo de desenho"><svg class="ic"><use href="#i-chevron"/></svg></button>
            </div>
            <button class="btn primary-soft tb-pill-btn" data-act="export" title="Exportar (Ctrl+Shift+E)"><svg class="ic"><use href="#i-export"/></svg><span>Exportar</span></button>
            <button class="btn icon tb-icon-btn" data-menu="more" title="Mais opções"><svg class="ic"><use href="#i-more"/></svg></button>
            <button class="btn primary-soft tb-pill-btn" id="tb-present" data-act="present" title="Apresentar — inicia a apresentação desta aba"><svg class="ic"><use href="#i-eye"/></svg><span>Apresentar</span></button>
          </div>

          <div class="win-divider"></div>

          <div class="window-controls" aria-label="Controles da janela">
            <button class="win-btn" id="win-min" title="Minimizar" aria-label="Minimizar"><svg class="win-ic"><use href="#i-win-min"/></svg></button>
            <button class="win-btn" id="win-max" title="Maximizar" aria-label="Maximizar"><svg class="win-ic"><use href="#i-win-max"/></svg></button>
            <button class="win-btn close" id="win-close" title="Fechar" aria-label="Fechar"><svg class="win-ic"><use href="#i-win-close"/></svg></button>
          </div>
        </div>
      </header>

      <nav id="tabbar" aria-label="Documentos abertos"></nav>

      <div id="body">
        <aside id="sidebar">

          <div class="sb-tabs" role="tablist" aria-label="Painéis">
            <span class="sb-pill" aria-hidden="true"></span>
            <button class="sb-tab" data-side="home" role="tab" title="Início: abertos, recentes e rascunhos"><svg class="ic"><use href="#i-home"/></svg></button>
            <button class="sb-tab" data-side="projects" role="tab" title="Projetos: suas pastas com documentos"><svg class="ic"><use href="#i-grid"/></svg></button>
            <button class="sb-tab" data-side="outline" role="tab" title="Estrutura (títulos) do documento"><svg class="ic"><use href="#i-list"/></svg></button>
          </div>
          <label class="sb-search">
            <svg class="ic"><use href="#i-search"/></svg>
            <input id="sb-search" type="text" placeholder="Buscar" autocomplete="off" spellcheck="false" />
          </label>


          <section class="sb-panel" id="sp-projects" hidden>
            <div class="sb-head">
              <h3>Projetos</h3>
              <span class="sb-actions">
                <button class="sb-mini" id="proj-refresh" title="Atualizar a lista de documentos"><svg class="ic"><use href="#i-refresh"/></svg></button>
                <button class="sb-mini" id="proj-add" title="Adicionar uma pasta como projeto"><svg class="ic"><use href="#i-folder-plus"/></svg></button>
                <button class="sb-mini" id="proj-new" title="Novo documento no projeto selecionado"><svg class="ic"><use href="#i-plus"/></svg></button>
              </span>
            </div>
            <div class="pj-crumbs" id="proj-crumbs">
              <button class="pj-back" id="proj-back" type="button" title="Voltar à pasta anterior" disabled><svg class="ic"><use href="#i-back"/></svg></button>
              <nav class="pj-path" id="proj-path" aria-label="Caminho da pasta"></nav>
            </div>
            <div id="projects-tree" class="sb-scroll"></div>
          </section>

          <section class="sb-panel" id="sp-outline" hidden>
            <div class="sb-head">
              <h3>Estrutura</h3>
              <span class="sb-actions">
                <button class="sb-mini" id="ol-collapse" title="Recolher todas as seções"><svg class="ic"><use href="#i-chevron-r"/></svg></button>
                <button class="sb-mini" id="ol-expand" title="Abrir todas as seções"><svg class="ic"><use href="#i-chevron"/></svg></button>
              </span>
            </div>
            <div id="outline" class="sb-scroll"></div>
          </section>
        </aside>

        <main id="editor-wrap">
          <div id="toolbar">
            <button class="tbtn" data-act="bold" title="Negrito (Ctrl+B)"><b>B</b></button>
            <button class="tbtn" data-act="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
            <button class="tbtn" data-act="heading" title="Título (H1 → H3)"><b>H</b></button>
            <span class="tsep"></span>
            <button class="tbtn" data-act="list" title="Lista">•</button>
            <button class="tbtn" data-act="task" title="Lista de tarefas (campo clicável no preview)"><span class="mono">[ ]</span></button>
            <button class="tbtn" data-act="table" title="Tabela">▦</button>
            <button class="tbtn" data-act="link" title="Link">🔗</button>
            <button class="tbtn" data-act="image" title="Inserir imagem (Ctrl+V ou arrastar arquivo)"><svg class="ic"><use href="#i-image"/></svg></button>
            <span class="tsep"></span>
            <button class="tbtn" data-act="align-left" title="Alinhar à esquerda"><svg class="ic"><use href="#i-align-left"/></svg></button>
            <button class="tbtn" data-act="align-center" title="Centralizar"><svg class="ic"><use href="#i-align-center"/></svg></button>
            <button class="tbtn" data-act="align-right" title="Alinhar à direita"><svg class="ic"><use href="#i-align-right"/></svg></button>
            <button class="tbtn" data-act="align-justify" title="Justificar (como no Word)"><svg class="ic"><use href="#i-align-justify"/></svg></button>
            <button class="tbtn" data-act="mark" title="Destaque (marca-texto)"><svg class="ic"><use href="#i-mark"/></svg></button>
            <button class="tbtn" data-act="small" title="Letras menores (texto pequeno) — clique de novo para voltar ao normal"><span class="mono">A−</span></button>
            <span class="tsep"></span>
            <button class="tbtn" data-act="toggle-more" id="tb-more" title="Mais formatação"><svg class="ic"><use href="#i-more"/></svg></button>
            <span class="tsep"></span>
            <button class="tbtn wide" data-act="ai-template" title="Modelo estruturado para pedir algo à IA">Modelo IA</button>
            <button class="tbtn wide" data-act="ai-docs" title="Criar uma skill (SKILL.md) ou regras do agente (AGENTS.md, CLAUDE.md) com ajuda">Skills e regras</button>
            <div id="toolbar-more" hidden>
              <button class="tbtn" data-act="strike" title="Riscado"><s>S</s></button>
              <button class="tbtn" data-act="code" title="Código embutido"><span class="mono">&lt;/&gt;</span></button>
              <button class="tbtn" data-act="codeblock" title="Bloco de código"><span class="mono">```</span></button>
              <button class="tbtn" data-act="quote" title="Citação">&gt;</button>
              <button class="tbtn" data-act="olist" title="Lista numerada">1.</button>
              <button class="tbtn" data-act="hr" title="Linha divisória">―</button>
              <button class="tbtn" data-act="mermaid" title="Diagrama (Mermaid)">◈</button>
            </div>
          </div>
          <div id="editor"></div>
        </main>

        <div id="splitter" title="Arraste para redimensionar · duplo clique volta a 50/50"></div>

        <section id="settings-page" hidden aria-label="Configurações"></section>

        <section id="word-pane" hidden aria-label="Documento Word">
          <div id="word-ribbon" class="wd-ribbon" role="toolbar" aria-label="Formatação"></div>
          <div id="wd-stage">
            <div id="wd-holder">
              <div id="wd-zoom">
                <div id="wd-sheet" class="wd-sheet">
                  <div class="wd-hdr-first" hidden></div>
                  <div id="word-editor"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="wd-zoombar">
            <span id="wd-pageinfo">Página 1 de 1</span>
            <span class="flex"></span>
            <button class="btn small" id="wd-zoom-out" title="Diminuir o zoom">−</button>
            <input id="wd-zoom-range" type="range" min="50" max="200" step="10" value="100" aria-label="Zoom" />
            <button class="btn small" id="wd-zoom-in" title="Aumentar o zoom">+</button>
            <span id="wd-zoom-val">100%</span>
          </div>
        </section>
        <section id="powerpoint-pane" hidden aria-label="Apresentação"></section>
        <section id="excel-pane" hidden aria-label="Planilha"></section>
        <section id="home-page" hidden aria-label="Início"></section>

        <section id="preview-wrap">
          <div id="preview-bar" hidden>
            <div class="seg" role="group" aria-label="Idioma da pré-visualização">
              <button class="seg-btn" data-lang-view="pt">PT-BR</button>
              <button class="seg-btn" data-lang-view="en">English</button>
              <button class="seg-btn" data-lang-view="both">Os dois</button>
            </div>
            <span id="tr-status" class="tr-status" aria-live="polite"></span>
            <span class="flex"></span>
            <button class="btn small" id="tr-layout" title="Alternar entre lado a lado e um embaixo do outro"><svg class="ic"><use href="#i-columns"/></svg></button>
            <button class="btn small" data-act="translate-settings" title="Configurar a tradução"><span>Ajustes</span></button>
          </div>
          <div id="preview-cols">
            <div class="pv-col" id="pv-pt">
              <div class="pv-label" hidden>PT-BR</div>
              <div id="preview" class="markdown-body"></div>
            </div>
            <div class="pv-col" id="pv-en" hidden>
              <div class="pv-label">English</div>
              <div id="preview-en" class="markdown-body"></div>
            </div>
          </div>
        </section>

        <!-- Alça de "puxar" a pré-visualização de volta: existe SÓ com a prévia fechada
             (ver `body.no-preview` em styles/editor.css). Fica como último item do
             `#body`, então ocupa uma faixa própria na direita — sem ela, a alça cairia
             em cima da barra de rolagem do editor. -->
        <div id="preview-puxa" title="Clique para trazer a pré-visualização de volta; arraste para a esquerda para aumentá-la"></div>
      </div>

      <footer id="statusbar">
        <span id="st-words">0 palavras</span>
        <span id="st-chars">0 caracteres</span>
        <span id="st-lines">1 linha</span>
        <span id="st-cursor">Ln 1, Col 1</span>
        <span class="flex"></span>
        <button id="st-deep" class="path-btn st-deep" hidden title="Abrir a revisão inteligente: palavras repetidas e trocas sugeridas"></button>
        <button id="st-writing" class="path-btn" hidden title="Abrir a revisão de texto (F7)"></button>
        <span id="save-state" class="muted">Novo documento</span>
        <button id="st-backup" class="path-btn st-backup" title="Backup em disco" hidden>🟢</button>
        <button id="st-history" class="path-btn" title="Histórico de versões deste documento">Histórico</button>
        <button id="st-path" class="path-btn" title="Mostrar arquivo na pasta" hidden></button>
      </footer>
    </div>

    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
