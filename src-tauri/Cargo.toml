[package]
name = "mdcreator"
version = "0.1.0"
description = "Editor Markdown com desenho e imagens"
authors = ["mdCreator"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mdcreator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
