# "et al" e "etal" viram "et al." — ponto só depois de "al".
id = "abnt.et_al"
norma = "nbr10520:2023"
grupo = "C"
severidade = "warning"
auto = true
ignorar_caixa = true
regex = '(?<trecho>(?:et\.[<<espaco>>]*al|etal)\.?)'
trecho = "trecho"
antes = "nao_letra"
depois = "nao_ponto_nem_letra"
substituir = "et al."
mensagem = "[ABNT NBR 10520:2023] A grafia da expressão latina é “et al.” (ponto só em “al.”); o uso é opcional"
